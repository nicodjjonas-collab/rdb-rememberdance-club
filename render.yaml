services:
  - type: web
    name: rdb-club
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_PASS
        generateValue: true
      - key: ADMIN_EMAILS
        value: ""
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: ""
