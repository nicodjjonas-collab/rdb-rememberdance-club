<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R.D.B. — Validar email</title>
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  .authbox { max-width: 420px; margin: 8vh auto; background: var(--glass); border: 1px solid var(--stroke); border-radius: 18px; backdrop-filter: blur(14px); padding: 30px; text-align: center; }
  #msg { margin-top: 12px; } #msg.err { color: #ff7d9c; } #msg.ok { color: var(--cyan); }
</style>
</head>
<body>
<div id="bg3d"></div><div class="vignette"></div>
<header><div class="logo"><video class="logo-vid" src="videos/logo.mp4" autoplay muted loop playsinline></video><div>R.D.B. <span>ReMeMBeR DaNCe CLuB</span></div></div></header>
<main><div class="authbox fade-in"><h1>Validando…</h1><div id="msg">…</div></div></main>
<script src="js/bg3d.js"></script>
<script>
(function () {
  const t = new URLSearchParams(location.search).get('t');
  const msg = document.getElementById('msg');
  if (!t) { msg.className = 'err'; msg.textContent = 'Enlace inválido.'; return; }
  fetch('/api/verify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: t }) })
    .then(async r => {
      const j = await r.json();
      if (j.ok) { msg.className = 'ok'; msg.innerHTML = '¡Cuenta validada! Entrando al foro…'; setTimeout(() => location.href = '/foro.html', 1200); }
      else { msg.className = 'err'; msg.textContent = j.error || 'Error'; }
    }).catch(() => { msg.className = 'err'; msg.textContent = 'Error de red'; });
})();
</script>
</body>
</html>
